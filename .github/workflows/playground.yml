name: Try in Playground

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  playground-preview:
    name: Playground PR preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & build
        run: npm ci && npm run build

      - uses: WordPress/action-wp-playground-pr-preview@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          blueprint-file: blueprints/blueprint.json
          repo-to-playground-directory: wp-content/plugins/camaleaun-worldcup2026
